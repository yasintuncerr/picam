# PiCam Nginx — HTTP + HTTPS reverse proxy
#
# Setup:
#   1. Generate certificates first:  sudo ./setup-ssl.sh
#   2. Copy this config:
#      sudo cp nginx-picam.conf /etc/nginx/sites-available/picam
#      sudo ln -sf /etc/nginx/sites-available/picam /etc/nginx/sites-enabled/picam
#      sudo rm -f /etc/nginx/sites-enabled/default
#   3. Test and start:
#      sudo nginx -t && sudo systemctl restart nginx

# ──── HTTP → HTTPS redirect ────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ──── HTTPS server ────
server {
    listen 443 ssl;
    server_name _;

    # SSL certificates (generated by setup-ssl.sh)
    ssl_certificate     /etc/nginx/ssl/picam-server.crt;
    ssl_certificate_key /etc/nginx/ssl/picam-server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ──── Static files (HTML/CSS/JS) ────
    root /home/picam/picam/www;
    index camera_controls.html;

    location / {
        try_files $uri $uri/ /camera_controls.html;
    }

    # ──── CA certificate download ────
    location /picam-ca.crt {
        alias /etc/nginx/ssl/picam-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="picam-ca.crt"';
    }

    # ──── API proxy → picam HTTP server (localhost:8080) ────
    location /capture {
        proxy_pass http://127.0.0.1:8080/capture;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;     # DNG capture may take longer
        proxy_buffering off;        # Stream large DNG files
    }

    location /video_controls {
        proxy_pass http://127.0.0.1:8080/video_controls;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    location /reset_controls {
        proxy_pass http://127.0.0.1:8080/reset_controls;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    location /capture_controls {
        proxy_pass http://127.0.0.1:8080/capture_controls;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    location /test_capture {
        proxy_pass http://127.0.0.1:8080/test_capture;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_buffering off;
    }

    location /camera_status {
        proxy_pass http://127.0.0.1:8080/camera_status;
        proxy_set_header Host $host;
        proxy_read_timeout 3s;
    }
}
